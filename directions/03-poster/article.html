<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Where the middle-wage jobs went, the poster</title>
<meta name="description" content="The first screens of the lead piece in direction three: the dissolve opener, the file block, two speeds, the chart as narrator with a year ruler, and the hand-over into the reading body. Design prototype with demo data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<link rel="stylesheet" href="poster.css">
</head>
<body data-page="article" data-ground="navy">
<header class="hdr" id="hdr"></header>
<nav class="rail" id="rail" aria-label="Steps of the argument"></nav>
<main>
  <!-- The dissolve opener, piece-specific: the duotone photograph dissolves into the lead chart's halftone cover; the title docks into the header; the four steps dock into the rail. -->
  <section class="opener sec g-navy" id="opener" data-ground="navy" aria-label="Opening">
    <div class="stage" id="stage">
      <div class="op-cover">
        <div class="stage-fb" id="fb"><img class="duo duo--red" data-file="office-people.jpg" data-tone="red" src="../../assets/img/office-people.jpg" width="1400" height="875" alt="People at desks in an open office, silhouetted against the windows"><canvas class="fb-cover" aria-hidden="true"></canvas></div>
        <canvas class="stage-gl" id="gl" aria-hidden="true" hidden></canvas>
        <div class="op-progress" id="op-progress" aria-hidden="true"><i></i><i></i><i></i></div>
        <h1 class="op-title disp disp--title h1" id="op-title"><span class="ln">Where the</span><span class="ln">middle-</span><span class="ln">wage jobs</span><span class="ln">went</span></h1>
        <div class="op-kicker mono" id="op-kicker"></div>
        <p class="op-deck serif s32" id="op-deck"></p>
        <nav class="op-index op-index--steps" id="op-index" aria-label="Steps of the argument"></nav>
      </div>
      <div class="op-final op-final--article" id="op-final"><div id="op-final-body"></div></div>
    </div>
  </section>

  <!-- The file block in mono under the docked title -->
  <section class="sec g-off" data-ground="off" aria-label="File">
    <div class="frame"><dl class="file" id="file"></dl></div>
  </section>

  <!-- Two speeds: three numerals at 155px with a 13px mono source line beneath each, and the viewpoint paragraph -->
  <section class="sec g-off pad" id="two" data-ground="off" aria-label="Two speeds">
    <div class="frame two"><div class="two-nums" id="two-nums"></div><div class="two-view" id="two-view"></div></div>
  </section>

  <!-- The narrator: the chart pinned at the right, the four steps at the left, the year ruler beneath the chart -->
  <section class="sec g-off" id="narrator" data-ground="off" aria-label="The argument, step by step">
    <div class="frame narr">
      <div class="narr-steps" id="steps"></div>
      <div class="narr-fig">
        <div id="narr-chart"></div>
        <div class="ruler" id="ruler"></div>
        <p class="mono dim" style="margin-top:10px;display:flex;justify-content:space-between"><span>Year ruler, 1995 to 2024</span><span>Now at <b id="ruler-now" class="red-text"></b></span></p>
      </div>
    </div>
  </section>

  <!-- The red seam: a 120px block with the FIG 1 label hands over to the reading body -->
  <div class="seam" id="seam" aria-hidden="true"><div class="frame" id="seam-body"></div></div>

  <section class="sec g-off pad" id="reading" data-ground="off" aria-label="The piece">
    <div class="frame body-grid"><div class="prose" id="body"></div><aside class="fig-notes" id="fig-notes"></aside></div>
    <div class="frame"><div class="continues" id="continues"></div><div class="related" id="related"></div></div>
  </section>

  <footer class="sec g-navy" data-ground="navy">
    <div class="frame" id="footer-body"></div>
  </footer>
</main>
<script src="../../lib/content.js"></script>
<script src="../../lib/content-phase-b.js"></script>
<script src="../../lib/charts.js"></script>
<script src="../../lib/motion.js"></script>
<script src="../../lib/art.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="poster.js"></script>
</body>
</html>
